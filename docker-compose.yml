services:
  postgres:
    image: postgres:16-alpine
    container_name: wip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wip_password}
      POSTGRES_DB: ${POSTGRES_DB:-wip}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wip -d wip"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: wip-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- Core ---
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Johannesburg
      - TZ=Africa/Johannesburg
      # --- WIP notification config (values come from .env, git-ignored) ---
      - WIP_MAIL_FROM=${WIP_MAIL_FROM:-}
      - WIP_DEMO_INBOX=${WIP_DEMO_INBOX:-}
      - WIP_DEMO_WHATSAPP=${WIP_DEMO_WHATSAPP:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-}
      - TWILIO_CONTENT_SID=${TWILIO_CONTENT_SID:-}
      # --- Security / task runners ---
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # --- Persist n8n's own data in Postgres too ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-wip}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-wip}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-wip_password}
      - DB_POSTGRESDB_SCHEMA=n8n
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: wip-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./vercel-app/public:/usr/share/nginx/html:ro
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
