<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WIP — Workflow Intelligence Platform</title>
<meta name="description" content="Work. Report. Approve. Done. — the WIP conversational assistant." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f9; --surface:#ffffff; --surface-2:#f7f8fc; --elevated:#ffffff;
    --text:#161a26; --muted:#6b7280; --faint:#9aa2b1; --line:#e6e8ef;
    --brand:#4f46e5; --brand-2:#7c6cf6; --accent:#0ea5e9; --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --user-bubble:#4f46e5; --user-text:#ffffff; --bot-bubble:#ffffff;
    --shadow:0 1px 2px rgba(16,20,40,.04), 0 8px 24px rgba(16,20,40,.06);
    --radius:16px; --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]).dark-fallback{}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0a0d15; --surface:#12161f; --surface-2:#151a25; --elevated:#161b27;
    --text:#e8ecf4; --muted:#94a0b3; --faint:#5f6b7e; --line:#232a38;
    --brand:#6d67f0; --brand-2:#8b7cf8; --accent:#38bdf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
    --user-bubble:#5b54e6; --user-text:#ffffff; --bot-bubble:#1a2030;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0a0d15; --surface:#12161f; --surface-2:#151a25; --elevated:#161b27;
    --text:#e8ecf4; --muted:#94a0b3; --faint:#5f6b7e; --line:#232a38;
    --brand:#6d67f0; --brand-2:#8b7cf8; --accent:#38bdf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
    --user-bubble:#5b54e6; --user-text:#ffffff; --bot-bubble:#1a2030;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  button,input,select,textarea{font-family:inherit}
  ::selection{background:color-mix(in srgb,var(--brand) 30%,transparent)}

  /* ---------- Top bar ---------- */
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;
    background:var(--surface);border-bottom:1px solid var(--line);z-index:10}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:19px;
    box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 45%,transparent)}
  .brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface-2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:.3s}
  .dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
  .dot.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
  .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.15s}
  .iconbtn:hover{border-color:var(--brand);color:var(--brand)}
  .iconbtn svg{width:18px;height:18px}

  /* ---------- Layout ---------- */
  .shell{flex:1;display:grid;grid-template-columns:1fr;min-height:0;position:relative}
  .chatwrap{display:flex;flex-direction:column;min-height:0;min-width:0}

  /* ---------- Identity bar ---------- */
  .who{display:flex;align-items:center;gap:10px;padding:11px 20px;flex-wrap:wrap;
    background:var(--surface);border-bottom:1px solid var(--line)}
  .who .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .who input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:9px;
    padding:8px 11px;font-size:13.5px;outline:none;width:210px;transition:.15s}
  .who input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:99px;
    padding:6px 11px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
  .chip:hover{border-color:var(--brand);color:var(--text)}
  .chip.active{background:color-mix(in srgb,var(--brand) 14%,var(--surface));border-color:var(--brand);color:var(--brand)}
  .role{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:5px;text-transform:uppercase}
  .role.emp{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .role.men{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand)}
  .role.adm{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
  .tools-toggle{margin-left:auto}

  /* ---------- Messages ---------- */
  #log{flex:1;overflow-y:auto;padding:26px 20px 8px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
  #log{background:radial-gradient(1200px 400px at 50% -10%, color-mix(in srgb,var(--brand) 5%,transparent), transparent 70%)}
  .row{display:flex;gap:11px;max-width:min(760px,100%);margin:0 auto;width:100%;align-items:flex-end}
  .row.me{flex-direction:row-reverse}
  .avatar{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:700}
  .avatar.bot{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
  .avatar.me{background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
  .bubble{padding:11px 15px;border-radius:var(--radius);line-height:1.5;font-size:14.5px;white-space:pre-wrap;
    word-wrap:break-word;box-shadow:var(--shadow);position:relative;max-width:78%;animation:pop .22s ease}
  .bot .bubble{background:var(--bot-bubble);border:1px solid var(--line);border-bottom-left-radius:5px}
  .me .bubble{background:var(--user-bubble);color:var(--user-text);border-bottom-right-radius:5px}
  .meta{font-size:10.5px;color:var(--faint);margin-top:6px;display:flex;gap:8px;align-items:center}
  .me .meta{justify-content:flex-end}
  .tag{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:5px;
    background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
  .sys{align-self:center;color:var(--muted);font-size:12px;text-align:center;max-width:520px;
    background:var(--surface-2);border:1px solid var(--line);padding:8px 14px;border-radius:12px}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:4px;padding:3px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ---------- Composer ---------- */
  .quick{display:flex;gap:8px;padding:6px 20px 0;overflow-x:auto;max-width:800px;margin:0 auto;width:100%}
  .quick::-webkit-scrollbar{height:0}
  .composer{padding:14px 20px calc(14px + env(safe-area-inset-bottom));max-width:800px;margin:0 auto;width:100%}
  .inputbar{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:18px;padding:8px 8px 8px 16px;box-shadow:var(--shadow);transition:.15s}
  .inputbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
  .inputbar textarea{flex:1;border:0;background:transparent;color:var(--text);font-size:15px;resize:none;
    outline:none;max-height:120px;line-height:1.5;padding:6px 0}
  .send{width:40px;height:40px;border-radius:12px;border:0;flex:none;cursor:pointer;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;transition:.15s}
  .send:hover{filter:brightness(1.08)}.send:disabled{opacity:.45;cursor:default;filter:grayscale(.3)}
  .send svg{width:19px;height:19px}
  .hint{text-align:center;font-size:11px;color:var(--faint);margin-top:8px}

  /* ---------- Tools drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(8,10,18,.45);opacity:0;pointer-events:none;transition:.25s;z-index:30}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:380px;max-width:90vw;background:var(--surface);
    border-left:1px solid var(--line);transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:31;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.15)}
  .drawer.open{transform:none}
  .drawer header{background:transparent}
  .drawer .body{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .field label{font-size:11.5px;color:var(--muted);font-weight:600}
  .field input,.field select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:9px 11px;font-size:13.5px;outline:none;transition:.15s}
  .field input:focus,.field select:focus{border-color:var(--brand)}
  .btn{width:100%;border:0;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;color:#fff}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2))}
  .btn.green{background:linear-gradient(135deg,var(--good),#0f9d76)}
  .btn:hover{filter:brightness(1.08)}
  .result{font-size:12.5px;color:var(--muted);margin-top:10px;white-space:pre-wrap;line-height:1.5;
    padding:10px;border-radius:9px;background:var(--surface);border:1px dashed var(--line);display:none}
  .result.show{display:block}
  code{font-family:var(--mono);font-size:11.5px;background:var(--surface);padding:1px 5px;border-radius:5px;color:var(--accent)}

  @media (max-width:560px){
    header{padding:12px 14px}.who{padding:10px 14px}.who input{width:100%}
    #log{padding:18px 12px 6px}.composer{padding:12px 12px}.quick{padding-left:12px;padding-right:12px}
    .brand p{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">W</div>
    <div><h1>Workflow Intelligence Platform</h1><p>Work · Report · Approve · Done</p></div>
  </div>
  <div class="spacer"></div>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">connecting…</span></div>
  <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="iconbtn tools-toggle" id="toolsBtn" title="Tools" aria-label="Open tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
</header>

<div class="shell">
  <div class="chatwrap">
    <div class="who">
      <span class="lbl">Acting as</span>
      <input id="email" type="email" value="sipho@wip.local" spellcheck="false" />
      <div class="presets" id="presets"></div>
    </div>

    <div id="log"></div>

    <div class="quick" id="quick"></div>
    <div class="composer">
      <div class="inputbar">
        <textarea id="input" rows="1" placeholder="Message WIP…  e.g. “I worked on the network rollout today”"></textarea>
        <button class="send" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </div>
</div>

<!-- Tools drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <div class="brand"><div class="logo" style="width:34px;height:34px;font-size:16px">W</div><div><h1 style="font-size:14px">Tools</h1><p>Mentor · Admin · Registration</p></div></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="closeDrawer" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <div class="body">
    <div class="card">
      <h3>🧑‍🏫 Mentor approval</h3>
      <div class="field"><label>Mentor email</label><input id="mMentor" value="naledi.mentor@wip.local"></div>
      <div class="field"><label>Employee email</label><input id="mEmp" value="sipho@wip.local"></div>
      <div class="field"><label>Action</label><select id="mAction">
        <option value="APPROVE">Approve</option><option value="REJECT">Reject</option><option value="REQUEST_CORRECTION">Request correction</option>
      </select></div>
      <button class="btn green" onclick="doApprove()">Submit approval</button>
      <div class="result" id="mResult"></div>
    </div>

    <div class="card">
      <h3>🛡️ Admin console</h3>
      <div class="field"><label>Admin email</label><input id="aEmail" value="admin@wip.local"></div>
      <div class="field"><label>Action</label><select id="aAction" onchange="aToggle()">
        <option value="TEAM_SUMMARY">Team summary</option>
        <option value="OUTSTANDING_REPORTS">Outstanding reports</option>
        <option value="LIST_PENDING">List pending registrations</option>
        <option value="APPROVE_REGISTRATION">Approve registration</option>
        <option value="REJECT_REGISTRATION">Reject registration</option>
      </select></div>
      <div class="field" id="aTargetWrap" style="display:none"><label>Target email</label><input id="aTarget" placeholder="user@wip.local"></div>
      <button class="btn primary" onclick="doAdmin()">Run</button>
      <div class="result" id="aResult"></div>
    </div>

    <div class="card">
      <h3>📝 Register a user</h3>
      <div class="field"><label>Full name</label><input id="rName" placeholder="Kabelo Newhire"></div>
      <div class="field"><label>Email</label><input id="rEmail" placeholder="kabelo@wip.local"></div>
      <div class="field"><label>Department</label><input id="rDept" placeholder="IT"></div>
      <button class="btn primary" onclick="doRegister()">Submit registration</button>
      <div class="result" id="rResult"></div>
    </div>
  </div>
</aside>

<script>
  // ---- Environment-aware API endpoints ----
  // Local (Docker + nginx): call n8n directly. Deployed (Vercel): call serverless proxies.
  const LOCAL = ['localhost','127.0.0.1','0.0.0.0'].includes(location.hostname);
  const N8N = 'http://' + (location.hostname || 'localhost') + ':5678';
  const API = {
    chat:     LOCAL ? N8N + '/webhook/chatbot'  : '/api/chat',
    approval: LOCAL ? N8N + '/webhook/approval' : '/api/approval',
    admin:    LOCAL ? N8N + '/webhook/admin'    : '/api/admin',
    register: LOCAL ? N8N + '/webhook/register' : '/api/register',
    health:   LOCAL ? N8N + '/healthz'          : '/api/health'
  };

  const $ = s => document.querySelector(s);
  const log = $('#log'), input = $('#input');

  // ---- Theme ----
  const savedTheme = localStorage.getItem('wip-theme');
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('wip-theme', next);
  };

  // ---- Identity presets ----
  const USERS = [
    ['sipho@wip.local','Sipho','emp'],['lerato@wip.local','Lerato','emp'],
    ['naledi.mentor@wip.local','Naledi','men'],['admin@wip.local','Aisha','adm']
  ];
  const presets = $('#presets');
  USERS.forEach(([em,name,role])=>{
    const b=document.createElement('button'); b.className='chip'; b.dataset.email=em;
    b.innerHTML = `${name} <span class="role ${role}">${role==='emp'?'Employee':role==='men'?'Mentor':'Admin'}</span>`;
    b.onclick=()=>{ $('#email').value=em; markActive(); };
    presets.appendChild(b);
  });
  function markActive(){ const v=$('#email').value.trim();
    [...presets.children].forEach(c=>c.classList.toggle('active', c.dataset.email===v)); }
  $('#email').addEventListener('input', markActive); markActive();

  // ---- Rendering ----
  function esc(s){ return String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
  function nowT(){ return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
  function addRow(who, html, {tag, meta=true}={}){
    const row=document.createElement('div'); row.className='row '+(who==='me'?'me':'bot');
    const av=document.createElement('div'); av.className='avatar '+(who==='me'?'me':'bot');
    av.textContent = who==='me' ? initials($('#email').value) : 'W';
    const col=document.createElement('div'); col.style.maxWidth='100%';
    const bub=document.createElement('div'); bub.className='bubble'; bub.innerHTML=html;
    col.appendChild(bub);
    if(meta){ const m=document.createElement('div'); m.className='meta';
      m.innerHTML = `<span>${nowT()}</span>` + (tag?`<span class="tag">${esc(tag)}</span>`:''); col.appendChild(m); }
    row.appendChild(av); row.appendChild(col); log.appendChild(row); log.scrollTop=log.scrollHeight;
    return bub;
  }
  function addSys(t){ const d=document.createElement('div'); d.className='sys'; d.textContent=t; log.appendChild(d); log.scrollTop=log.scrollHeight; }
  function initials(email){ const n=(email||'?').split('@')[0].replace(/[._]/g,' ').trim(); return (n[0]||'?').toUpperCase(); }

  // ---- Chat ----
  async function send(text){
    text = (text!=null ? text : input.value).trim();
    if(!text) return;
    input.value=''; autosize();
    addRow('me', esc(text));
    const bub = addRow('bot', '<span class="typing"><i></i><i></i><i></i></span>', {meta:false});
    $('#send').disabled=true;
    try{
      const r = await fetch(API.chat, {method:'POST',headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email:$('#email').value.trim(), message:text })});
      const data = await r.json().catch(()=>({reply:'(no response)'}));
      bub.textContent = data.reply || JSON.stringify(data);
      const meta=document.createElement('div'); meta.className='meta';
      meta.innerHTML=`<span>${nowT()}</span>`+(data.action?`<span class="tag">${esc(data.action)}</span>`:'');
      bub.parentNode.appendChild(meta);
    }catch(e){
      bub.textContent = '⚠️ Could not reach the assistant. '+(LOCAL?'Is the Docker stack running?':'Is N8N_BASE_URL set in Vercel and n8n public?');
      bub.style.color='var(--bad)';
    }finally{ $('#send').disabled=false; input.focus(); }
  }

  // ---- Tools actions ----
  async function call(url, body, el){
    el.classList.add('show'); el.textContent='…';
    try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json().catch(()=>({})); el.textContent = d.reply || JSON.stringify(d,null,1);
    }catch(e){ el.textContent='⚠️ '+e.message; }
  }
  window.doApprove=()=>call(API.approval,{mentor_email:$('#mMentor').value.trim(),employee_email:$('#mEmp').value.trim(),action:$('#mAction').value},$('#mResult'));
  window.doAdmin=()=>call(API.admin,{admin_email:$('#aEmail').value.trim(),action:$('#aAction').value,target_email:$('#aTarget').value.trim()},$('#aResult'));
  window.doRegister=()=>call(API.register,{full_name:$('#rName').value.trim(),email:$('#rEmail').value.trim(),department:$('#rDept').value.trim()},$('#rResult'));
  window.aToggle=()=>{ const a=$('#aAction').value; $('#aTargetWrap').style.display=/REGISTRATION/.test(a)?'flex':'none'; };

  // ---- Quick chips ----
  const QUICK=['Clock me in','I worked on the WhatsApp rollout today','Show my week','Submit my report','Clock me out','I\'m not feeling well today'];
  const quick=$('#quick');
  QUICK.forEach(q=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=q; b.onclick=()=>send(q); quick.appendChild(b); });

  // ---- Composer behaviour ----
  function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
  $('#send').onclick=()=>send();

  // ---- Drawer ----
  const drawer=$('#drawer'), scrim=$('#scrim');
  const openD=()=>{drawer.classList.add('open');scrim.classList.add('open');drawer.setAttribute('aria-hidden','false');};
  const closeD=()=>{drawer.classList.remove('open');scrim.classList.remove('open');drawer.setAttribute('aria-hidden','true');};
  $('#toolsBtn').onclick=openD; $('#closeDrawer').onclick=closeD; scrim.onclick=closeD;

  // ---- Health ----
  (async()=>{ const dot=$('#dot'), st=$('#statusText');
    try{ await fetch(API.health,{mode: LOCAL?'no-cors':'cors'}); dot.className='dot ok'; st.textContent=LOCAL?'connected (local)':'connected'; }
    catch{ dot.className='dot bad'; st.textContent='offline'; }
  })();

  addSys('👋 Welcome to WIP. Pick who you are above, then try a command or a quick chip below.');
</script>
</body>
</html>
